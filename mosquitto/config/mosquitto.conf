# Mosquitto Configuration for IoT Property Risk Monitoring
listener 1883
allow_anonymous true

# WebSocket listener for browser clients or web tools
listener 9001
protocol websockets
allow_anonymous true

# Persistence
persistence true
persistence_location /mosquitto/data/

# Logging
log_dest stdout
log_type error
log_type warning
log_type notice
log_type information
connection_messages true
log_timestamp true
