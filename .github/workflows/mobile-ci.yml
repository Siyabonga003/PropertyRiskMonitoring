name: Mobile CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: mobile-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze-and-test:
    name: Analyze and test (Flutter stable)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Show toolchain versions
        run: |
          flutter --version
          dart --version

      - name: Install dependencies
        run: flutter pub get

      - name: Format check (report only)
        continue-on-error: true
        run: dart format --output=none --set-exit-if-changed lib test 2>&1 | tee format.log

      - name: Analyze
        id: analyze
        continue-on-error: true
        run: |
          set -o pipefail
          flutter analyze 2>&1 | tee analyze.log

      - name: Test
        id: test
        if: always()
        continue-on-error: true
        run: |
          set -o pipefail
          flutter test --reporter expanded 2>&1 | tee test.log

      - name: Upload Dart logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dart-logs
          path: |
            mobile/analyze.log
            mobile/test.log
            mobile/format.log
          if-no-files-found: ignore
          retention-days: 7

      - name: Fail if analyze or test failed
        if: always() && (steps.analyze.outcome != 'success' || steps.test.outcome != 'success')
        run: exit 1

  build-android:
    name: Build debug APK
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Show toolchain versions
        run: |
          flutter --version
          java -version

      - name: Install dependencies
        run: flutter pub get

      # The repository pins Gradle 9.1.0 for the locally installed Flutter SDK.
      # Flutter stable in CI requires a newer Gradle, so the wrapper is aligned
      # here for the duration of the run only; the checked-in value is unchanged.
      - name: Align Gradle wrapper with CI Flutter
        run: |
          sed -i 's#^distributionUrl=.*#distributionUrl=https\\://services.gradle.org/distributions/gradle-9.3.1-all.zip#' \
            android/gradle/wrapper/gradle-wrapper.properties
          grep distributionUrl android/gradle/wrapper/gradle-wrapper.properties

      - name: Build debug APK
        id: build
        continue-on-error: true
        run: |
          set -o pipefail
          flutter build apk --debug 2>&1 | tee build.log

      - name: Upload build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: mobile/build.log
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload APK
        if: steps.build.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: mobile/build/app/outputs/flutter-apk/*.apk
          if-no-files-found: ignore
          retention-days: 7

      - name: Fail if build failed
        if: steps.build.outcome != 'success'
        run: exit 1

  report:
    name: Publish results to pull request
    needs: [analyze-and-test, build-android]
    if: always() && github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: '*-logs'
          path: ci-logs
          merge-multiple: true

      - name: Post results comment
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          ANALYZE_RESULT: ${{ needs.analyze-and-test.result }}
          BUILD_RESULT: ${{ needs.build-android.result }}
        run: |
          set -e
          {
            echo "<!-- mobile-ci-report -->"
            echo "### Mobile CI results"
            echo ""
            echo "| Check | Result |"
            echo "| :--- | :--- |"
            echo "| Analyze and test | \`$ANALYZE_RESULT\` |"
            echo "| Debug APK build | \`$BUILD_RESULT\` |"
            for f in analyze.log test.log format.log build.log; do
              [ -f "ci-logs/$f" ] || continue
              echo ""
              echo "<details><summary><code>$f</code> (last 150 lines)</summary>"
              echo ""
              echo '```'
              tail -n 150 "ci-logs/$f"
              echo '```'
              echo ""
              echo "</details>"
            done
          } > body.md
          gh pr comment "$PR_NUMBER" --body-file body.md --edit-last --create-if-none
